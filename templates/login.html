<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aerostat</title>
<style>
        * {
        margin: 0;
        padding: 0;
            box-sizing: border-box;
    }
    
    body {
            background: url('/static/images/aerostat1.jpg');
        background-size: cover;
            background-position: center;
        background-attachment: fixed;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
            color: #fff;
        position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(26, 26, 46, 0.7) 50%, rgba(22, 33, 62, 0.6) 100%);
            backdrop-filter: blur(8px);
            z-index: -1;
            animation: backgroundPulse 8s ease-in-out infinite;
        }
        
        @keyframes backgroundPulse {
            0%, 100% { 
                opacity: 0.8; 
                backdrop-filter: blur(8px);
            }
            50% { 
                opacity: 0.9; 
                backdrop-filter: blur(12px);
            }
        }

        .login-container {
            background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 20px;
            padding: 50px;
        width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
    }
    
    .login-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
                transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-title {
            color: #3b82f6;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .empyreal-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .empyreal-logo img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .empyreal-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #666;
            margin: 0;
            line-height: 1;
        }

        .galaxy-text {
            font-size: 3.5rem;
            font-weight: 700;
            color: #333;
            margin: 0;
            line-height: 1;
            position: relative;
        }

        .galaxy-special {
            color: #1e40af;
        }

        .galaxy-x {
            position: relative;
            display: inline-block;
        }

        .galaxy-x::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -15px;
            width: 40px;
            height: 2px;
            background: #1e40af;
            transform: rotate(-15deg);
            border-radius: 1px;
        }

        .blimp-container {
            position: relative;
            display: inline-block;
            margin-left: 20px;
        }

        .blimp {
            width: 60px;
            height: 20px;
            background: #1e40af;
            border-radius: 20px 20px 10px 10px;
            position: relative;
            display: inline-block;
        }

        .blimp::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 10px;
            width: 8px;
            height: 8px;
            background: #1e40af;
            border-radius: 50%;
        }

        .blimp::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 25px;
            width: 10px;
            height: 8px;
            background: #1e40af;
            border-radius: 0 0 5px 5px;
        }

        .connecting-line {
            position: absolute;
            top: -5px;
            left: -25px;
            width: 30px;
            height: 2px;
            background: #1e40af;
            transform: rotate(15deg);
            border-radius: 1px;
        }

        .tagline {
            font-size: 1rem;
            color: #dc2626;
            font-weight: 500;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            color: #ccc;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .login-description {
            color: #888;
        font-size: 0.9rem;
            line-height: 1.5;
    }
    
    .login-form {
            margin-top: 30px;
    }
    
    .form-group {
            margin-bottom: 25px;
    }
    
    .form-group label {
        display: block;
            color: #3b82f6;
            margin-bottom: 10px;
        font-weight: 600;
            font-size: 1rem;
    }
    
    .form-group input {
        width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .form-group input:focus {
        outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            background: rgba(0, 0, 0, 0.8);
        }

        .form-group input::placeholder {
            color: #666;
    }
    
    .login-btn {
        width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
    }
    
    .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
    }
    
    .login-btn:active {
            transform: translateY(-1px);
    }
    
    .error-message {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .system-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .system-info h4 {
            color: #3b82f6;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .system-info p {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .loading {
            display: none;
        text-align: center;
            color: #3b82f6;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }
            
            .empyreal-text {
                font-size: 1.4rem;
            }
            
            .galaxy-text {
                font-size: 2.8rem;
            }
            
            .blimp {
                width: 45px;
                height: 15px;
            }
            
            .blimp-container {
                margin-left: 15px;
            }
            
            .tagline {
                font-size: 0.9rem;
            }
            
            .login-title {
                font-size: 2.5rem;
            }
            
            .login-subtitle {
                font-size: 1rem;
        }
    }
</style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="empyreal-logo">
                <img src="/static/images/logo.png" alt="Empyreal Galaxy Logo">
            </div>
            <h1 class="login-title">Aerostat</h1>
            <p class="login-subtitle">Ground Control Station</p>
            <p class="login-description">Secure access to the aerospace monitoring and control system</p>
        </div>
        
        <div class="error-message" id="error-message">
            Invalid credentials. Please check your username/email and password.
        </div>
        
        <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username or email" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn">Launch Control Station</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Authenticating...</p>
        </div>

        <div class="system-info">
            <h4>Secure Access</h4>
            <p>Login with your username or email address. Contact your system administrator for access.</p>
        </div>
</div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('login-form').style.display = 'none';
            
            // Load users from local storage (your existing user management system)
            const storedUsers = localStorage.getItem('aerostat_users');
            let allUsers = [];
            
            // Always include the default admin user
            const defaultAdmin = { id: 'admin', username: 'admin', email: 'admin@aerostate.com', role: 'super_admin', password: 'admin123' };
            
            if (storedUsers) {
                allUsers = JSON.parse(storedUsers);
                // Check if default admin exists, if not add it
                const adminExists = allUsers.find(user => user.id === 'admin');
                if (!adminExists) {
                    allUsers.unshift(defaultAdmin);
                }
            } else {
                // If no users in local storage, use default super admin
                allUsers = [defaultAdmin];
            }
            
            console.log('Available users for login:', allUsers);
            
            // Simulate authentication delay
            setTimeout(() => {
                console.log('Attempting login with:', { username, password });
                console.log('Looking for user in:', allUsers);
                
                // Validate credentials against loaded users - check both username and email
                const foundUser = allUsers.find(user =>
                    (user.username === username || user.email === username) &&
                    user.password === password
                );
                
                console.log('Found user:', foundUser);
                
                if (foundUser) {
                    // If credentials are valid, redirect to dashboard with user info
                    console.log('Login successful, redirecting...');
                    window.location.href = `/professional_video_charts?role=${foundUser.role}&username=${encodeURIComponent(foundUser.username)}`;
                } else {
                    // Hide loading and show error
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('login-form').style.display = 'block';
                    showError('Invalid username/email or password. Please check your credentials.');
                }
            }, 1500);
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.add('show');
            
            // Hide error after 5 seconds
    setTimeout(() => {
                errorElement.classList.remove('show');
            }, 5000);
        }

        // Add some visual feedback
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
            
            // Debug: Clear localStorage if needed (uncomment to reset)
            // localStorage.removeItem('aerostat_users');
            // console.log('LocalStorage cleared for fresh start');
});
</script>
</body>
</html>
</html>
